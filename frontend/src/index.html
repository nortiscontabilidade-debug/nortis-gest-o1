<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nortis Gestão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#101211;--cd:#1B1B1B;--bd:#2A2D2C;--tx:#F1F4F3;--mu:#8C9491;--nv:#1A1A1A;--pr:#08B785;--on:#04130D;--hv:#242726;--ok:#2FCB8F;--wn:#E3A93B;--er:#F27A7A;--gr:linear-gradient(90deg,#08B785,#0B6B52);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F2F5F4;--cd:#fff;--bd:#E1E6E4;--tx:#141616;--mu:#69716E;--pr:#0A8F68;--on:#fff;--hv:#ECF1EF;--ok:#0E8F63;--wn:#B7791F;--er:#C23B3B;color-scheme:light}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:14px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
aside{width:224px;background:var(--nv);color:#9AA3A0;border-right:1px solid #262826;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex:none}
.brand{padding:0 4px 28px}.brand img{width:100%;display:block}.brand small{display:block;margin:8px 0 0 3px;color:#08B785;font-weight:700;font-size:13px;letter-spacing:.06em}
nav a{display:block;padding:9px 12px;border-radius:8px;color:#9AA3A0;text-decoration:none;font-weight:600;margin-bottom:2px;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.06)}nav a.on{background:rgba(8,183,133,.13);color:#fff;box-shadow:inset 3px 0 0 #08B785}
.me{margin-top:auto;font-size:12px;color:#6F7774;padding:0 8px}
main{flex:1;min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:14px 36px;border-bottom:1px solid var(--bd);background:var(--cd);position:sticky;top:0;z-index:5}
.sb{position:relative;flex:1;max-width:460px}.sb input{width:100%}
#sr{position:absolute;top:42px;left:0;right:0;background:var(--cd);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 32px rgba(11,31,58,.16);overflow:hidden;display:none}
#sr div{padding:9px 13px;cursor:pointer}#sr div:hover{background:var(--hv)}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;outline:0}
input:focus,select:focus,.btn:focus-visible{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
.btn{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--hv)}.btn.pr{background:var(--pr);border-color:var(--pr);color:var(--on)}.btn.pr:hover{opacity:.92}
.sp{flex:1}
#v{padding:28px 36px 48px;max-width:1360px}
h1{font-size:25px;font-weight:800;letter-spacing:-.5px}h2{font-size:15px;font-weight:700;margin-bottom:12px}
.sub{color:var(--mu);margin:2px 0 22px}
.g{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2x{grid-template-columns:1.5fr 1fr}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:18px 20px}
.kp b{display:block;font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:8px 0 2px}
.mu{color:var(--mu)}.s{font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:0 12px 9px;border-bottom:1px solid var(--bd)}
td{padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr.rw{cursor:pointer}tbody tr.rw:hover{background:var(--hv)}
.cd.t{padding:8px 8px 4px}
.p{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,currentColor 12%,transparent)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.p.mu{color:var(--mu)}
.br{display:grid;grid-template-columns:118px 1fr 22px;gap:10px;align-items:center;margin-top:11px;font-size:13px}
.tr{height:8px;border-radius:9px;background:var(--hv)}.tr i{display:block;height:100%;border-radius:9px;background:var(--gr)}
.fb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.fb input{width:280px}
.hd{display:flex;gap:16px;align-items:center}
.av{width:54px;height:54px;border-radius:12px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:22px 0 18px;overflow-x:auto}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--tx)}.tabs a.on{color:var(--tx);border-color:var(--pr)}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 28px}.fl span{display:block;color:var(--mu);font-size:12px}.fl b{font-weight:600}
.al{padding:11px 14px;border-radius:10px;margin-bottom:16px;background:color-mix(in srgb,currentColor 10%,transparent);font-weight:600}
.tl{border-left:2px solid var(--bd);margin-left:6px}.tl div{padding:0 0 16px 18px;position:relative}
.tl div:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pr)}
.lk{color:var(--pr);cursor:pointer;font-weight:600;font-size:12px;margin-left:6px}
.cc{cursor:pointer}.cc:hover{border-color:var(--pr)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.ln:last-child{border:0}
#md{display:none;position:fixed;inset:0;background:rgba(7,20,42,.55);place-items:center;z-index:20}#md.on{display:grid}
.mb{background:var(--cd);border-radius:14px;padding:24px;width:540px;max-width:92vw}
.mb label{display:block;font-size:12px;color:var(--mu);margin-top:12px}.mb input,.mb select{width:100%;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:30}
.bar{display:flex;gap:10px;align-items:center;position:sticky;top:63px;z-index:4;background:var(--bg);padding:12px 0;margin-bottom:6px;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}.chips a{padding:5px 12px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mu);background:var(--cd)}.chips a:hover{color:var(--tx);border-color:var(--pr)}
.fi span{display:block;color:var(--mu);font-size:12px;margin-bottom:3px}.fi input,.fi select{width:100%}
.ed td{padding:5px 5px}.ed th{padding:0 5px 8px}.ed input,.ed select{width:100%;padding:6px 8px;font-size:13px}
.x{color:var(--er);cursor:pointer;font-weight:700;padding:0 6px}.cd[id]{scroll-margin-top:140px;margin-bottom:16px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hh h2{margin:0}
main{background:radial-gradient(900px 420px at 88% -8%,rgba(8,183,133,.1),transparent 70%)}:root[data-theme="light"] main{background:none}
#ts{background:var(--pr);color:var(--on);font-weight:600}.mb{border:1px solid var(--bd)}
</style>
</head>
